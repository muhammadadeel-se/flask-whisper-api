<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Confirmation UI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 2rem auto;
            max-width: 650px;
            padding: 0 1rem;
            color: #333;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .action-card {
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1rem;
            background-color: #f8fafc;
        }
        .form-group {
            margin-bottom: 0.75rem;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: #475569;
        }
        input[type="text"], select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        button {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 0.65rem 1.25rem;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #status-msg {
            margin-top: 1rem;
            font-weight: 600;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <h1>Action Confirmation List</h1>
    <form id="actions-form">
        <div id="actions-list">
            {% for action in actions %}
            <div class="action-card" data-id="{{ action.id }}">
                <div class="form-group">
                    <label>Action ID</label>
                    <input type="text" value="{{ action.id }}" readonly style="background-color: #e2e8f0;">
                </div>
                <div class="form-group">
                    <label for="desc-{{ action.id }}">Description</label>
                    <input type="text" id="desc-{{ action.id }}" name="description" value="{{ action.description }}" required>
                </div>
                <div class="form-group">
                    <label for="status-{{ action.id }}">Status</label>
                    <select id="status-{{ action.id }}" name="status">
                        <option value="pending" {% if action.status == 'pending' %}selected{% endif %}>Pending</option>
                        <option value="confirmed" {% if action.status == 'confirmed' %}selected{% endif %}>Confirmed</option>
                    </select>
                </div>
            </div>
            {% endfor %}
        </div>
        <button type="submit">Save & Confirm Actions</button>
    </form>

    <div id="status-msg"></div>

    <script>
        document.getElementById('actions-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const cards = document.querySelectorAll('.action-card');
            const actions = [];

            cards.forEach(card => {
                const id = card.getAttribute('data-id');
                const description = card.querySelector('input[name="description"]').value;
                const status = card.querySelector('select[name="status"]').value;
                actions.push({ id, description, status });
            });

            const statusMsg = document.getElementById('status-msg');
            statusMsg.style.color = '#475569';
            statusMsg.innerText = 'Saving changes...';

            try {
                const response = await fetch('/confirm', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ actions })
                });

                const result = await response.json();

                if (response.ok) {
                    statusMsg.style.color = '#16a34a';
                    statusMsg.innerText = 'Actions successfully updated and saved to actions.json!';
                } else {
                    throw new Error(result.error || 'Failed to save actions.');
                }
            } catch (error) {
                statusMsg.style.color = '#dc2626';
                statusMsg.innerText = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
